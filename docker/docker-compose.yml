# Entorno local de Big Data: HDFS + YARN + Hive.
# MLflow no va en Docker: se instala en local con  bash servidor_mlflow.sh  (ver INSTALACION.md).
# Arranque:  cd docker && docker compose up -d
name: proyecto-ebaluacion1

services:
  # ---------------------------------------------------------------- HDFS
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    env_file: ./hadoop.env
    environment:
      CLUSTER_NAME: ebaluacion1
    ports:
      - "9870:9870"   # interfaz web de HDFS
      - "9000:9000"   # RPC de HDFS (fs.defaultFS)
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ../data/entrada:/entrada
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9870/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    env_file: ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9864/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------- YARN
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: resourcemanager
    hostname: resourcemanager
    restart: unless-stopped
    env_file: ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    ports:
      - "8088:8088"   # interfaz web de YARN
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/cluster"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped
    env_file: ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8042/node"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ---------------------------------------------------------------- Hive
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    platform: linux/amd64
    container_name: hive-metastore-postgresql
    hostname: hive-metastore-postgresql
    restart: unless-stopped
    volumes:
      - metastore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    platform: linux/amd64
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    env_file: ./hadoop.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9000 datanode:9864 hive-metastore-postgresql:5432"
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      hive-metastore-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  hiveserver2:
    image: bde2020/hive:2.3.2-postgresql-metastore
    platform: linux/amd64
    container_name: hiveserver2
    hostname: hiveserver2
    restart: unless-stopped
    env_file: ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000" # JDBC / beeline
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10000"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  namenode_data:
  datanode_data:
  metastore_data:
